<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PI Reading Club</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='32' height='32' rx='8' fill='%2316a34a'/%3E%3Cpath d='M7 8C7 6.89543 7.89543 6 9 6H15C16.1046 6 17 6.89543 17 8V22C17 22 14.5 20 12 20C9.5 20 7 22 7 22V8Z' fill='white' fill-opacity='0.9'/%3E%3Cpath d='M17 8C17 6.89543 17.8954 6 19 6H23C24.1046 6 25 6.89543 25 8V22C25 22 22.5 20 20 20C17.5 20 17 22 17 22V8Z' fill='white' fill-opacity='0.65'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-50: #f0fdf4; --green-100: #dcfce7; --green-200: #bbf7d0;
      --green-300: #86efac; --green-400: #4ade80; --green-500: #22c55e;
      --green-600: #16a34a; --green-700: #15803d; --green-800: #166534;
      --white: #ffffff;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280;
      --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937;
      --gray-900: #111827;
      --red-500: #ef4444; --red-600: #dc2626;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, var(--green-50) 0%, var(--white) 50%, var(--green-50) 100%);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    nav {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(34, 197, 94, 0.1);
    }

    .nav-brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 800; font-size: 1.2rem; color: var(--green-800); text-decoration: none;
    }

    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--gray-600); font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--green-600); }

    /* Main Content */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(34, 197, 94, 0.1);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--green-500), var(--green-400));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .auth-icon svg { width: 28px; height: 28px; color: white; }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      color: var(--gray-500);
      font-size: 0.95rem;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border-radius: 12px;
      background: var(--gray-100);
      padding: 4px;
      margin-bottom: 1.5rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray-500);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: var(--white);
      color: var(--green-700);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .auth-tab:hover:not(.active) {
      color: var(--gray-700);
    }

    /* Forms */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      background: var(--white);
    }

    .form-input:focus {
      border-color: var(--green-400);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .form-input::placeholder {
      color: var(--gray-400);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      color: white;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Error message */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--red-600);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* Success message */
    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: var(--green-700);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    /* Footer */
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--gray-100);
    }

    .auth-footer a {
      color: var(--green-600);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .auth-card {
        padding: 1.5rem;
        border-radius: 16px;
      }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-brand">PI Reading Club</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="discussion.html">Discussion</a></li>
    </ul>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1 class="auth-title">Welcome</h1>
        <p class="auth-subtitle">Join the PI Reading Club community</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('register')">Sign Up</button>
      </div>

      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>

      <!-- Login Form -->
      <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">
          <span>Login</span>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="register-name">Display Name</label>
          <input type="text" class="form-input" id="register-name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-email">Email</label>
          <input type="email" class="form-input" id="register-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <input type="password" class="form-input" id="register-password" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" id="register-btn">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        <p style="color: var(--gray-500); font-size: 0.85rem;">
          By continuing, you agree to our community guidelines.
        </p>
      </div>
    </div>
  </div>

  <script>
    const AUTH_TOKEN_KEY = 'pi-reading-club-token';
    const AUTH_USER_KEY = 'pi-reading-club-user';

    // Check if already logged in
    if (localStorage.getItem(AUTH_TOKEN_KEY)) {
      window.location.href = '/';
    }

    function showTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelector('.auth-tab:first-child').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelector('.auth-tab:last-child').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }

      hideMessages();
    }

    function showError(message) {
      const el = document.getElementById('error-message');
      el.textContent = message;
      el.classList.add('show');
      document.getElementById('success-message').classList.remove('show');
    }

    function showSuccess(message) {
      const el = document.getElementById('success-message');
      el.textContent = message;
      el.classList.add('show');
      document.getElementById('error-message').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<span>Logging in...</span>';

      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify(data.user));

        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
          // Redirect to previous page or home
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
          window.location.href = redirect;
        }, 1000);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span>Login</span>';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideMessages();

      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const btn = document.getElementById('register-btn');

      btn.disabled = true;
      btn.innerHTML = '<span>Creating account...</span>';

      try {
        const res = await fetch('/api/auth?action=register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify(data.user));

        showSuccess('Account created! Redirecting...');
        setTimeout(() => {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
          window.location.href = redirect;
        }, 1000);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
      }
    }

    // Check URL for tab parameter
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      showTab('register');
    }
  </script>
</body>
</html>
